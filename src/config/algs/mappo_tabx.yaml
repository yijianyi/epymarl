name: mappo_tabx
mac: basic_mac
agent: rnn
agent_output_type: pi_logits
action_selector: multinomial
mask_before_softmax: true
test_greedy: true
# The multinomial selector initializes a schedule but samples directly from the policy.
epsilon_start: 0.0
epsilon_finish: 0.0
epsilon_anneal_time: 1

runner: episode
batch_size_run: 1
batch_size: 8
buffer_size: 8
buffer_cpu_only: true

learner: ppo_learner
critic_type: cv_critic
lr: 0.0001
epochs: 4
eps_clip: 0.2
entropy_coef: 0.001
grad_norm_clip: 10
gamma: 0.99
q_nstep: 5
target_update_interval_or_tau: 0.01
standardise_rewards: false
standardise_returns: false
add_value_last_step: false

hidden_dim: 128
use_rnn: true
obs_agent_id: true
obs_last_action: false
obs_individual_obs: false

save_model: true
save_model_interval: 25000
t_max: 1500000
