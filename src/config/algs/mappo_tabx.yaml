name: mappo_tabx
mac: basic_mac
agent: rnn
agent_output_type: pi_logits
action_selector: multinomial
mask_before_softmax: true
test_greedy: true
# The multinomial selector initializes a schedule but samples directly from the policy.
epsilon_start: 0.0
epsilon_finish: 0.0
epsilon_anneal_time: 1

runner: episode
batch_size_run: 1
batch_size: 8
buffer_size: 8
buffer_cpu_only: true

learner: ppo_learner
critic_type: cv_critic
lr: 0.0001
epochs: 4
eps_clip: 0.2
entropy_coef: 0.001
grad_norm_clip: 10
gamma: 0.99
use_gae: true
gae_lambda: 0.97
q_nstep: 5
target_update_interval_or_tau: 0.01
standardise_rewards: false
standardise_returns: false
add_value_last_step: false

hidden_dim: 128
use_rnn: true
obs_agent_id: true
obs_last_action: false
obs_individual_obs: false

save_model: true
save_model_interval: 25000
t_max: 80000000

tabx_bc: false
tabx_demo_root: null
tabx_expected_demo_manifest_sha256: null
tabx_bc_teacher: medium
tabx_demo_opponent: medium
tabx_bc_steps: 1000
tabx_bc_batch_size: 32
tabx_bc_lr: 0.0005
tabx_dagger_rounds: 0
tabx_online_source: null
tabx_source_index_sha256: null
tabx_source_step0_sha256: null
tabx_publish_bc_step0: false
tabx_mix_start: 0.0
tabx_mix_decay_steps: 50000
tabx_mix_block_steps: 8
tabx_mappo_temp_peak: 1.0
tabx_mappo_temp_peak_step: 20000
tabx_mappo_temp_end_step: 100000
