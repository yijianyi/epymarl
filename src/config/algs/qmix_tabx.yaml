name: qmix_tabx
action_selector: epsilon_greedy
agent_output_type: q
learner: q_learner
mac: basic_mac
agent: rnn
mixer: qmix
runner: episode
batch_size_run: 1
use_rnn: true
hidden_dim: 128
obs_last_action: true
obs_agent_id: true
obs_individual_obs: false
mixing_embed_dim: 64
hypernet_layers: 2
hypernet_embed: 128
mixer_init_scale: 0.001
mixer_layer_norm: true
mixer_layer_norm_eps: 0.000001
double_q: true
lr: 0.00005
batch_size: 32
grad_norm_clip: 10
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 80000
evaluation_epsilon: 0.0
gamma: 0.99
standardise_rewards: false
standardise_returns: false
buffer_size: 256
buffer_cpu_only: true
target_update_interval_or_tau: 200
save_model: true
save_model_interval: 25000
t_max: 800000
